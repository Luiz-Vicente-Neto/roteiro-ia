services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: roteiro
      POSTGRES_PASSWORD: roteiro
      POSTGRES_DB: roteiro_ia
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roteiro -d roteiro_ia"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
