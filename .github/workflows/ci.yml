name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: roteiro
          POSTGRES_PASSWORD: roteiro
          POSTGRES_DB: roteiro_ia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roteiro -d roteiro_ia"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgres://roteiro:roteiro@localhost:5432/roteiro_ia

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes em memória
        run: pnpm test

      - name: Testes com Postgres
        run: pnpm test:db
