# Git hooks, installed by `pnpm install`. The same checks run in CI
# (.github/workflows/ci.yml); the Postgres tests run only there, since
# they need Docker. `nomes-locais` runs only here: it reads this clone's
# .git/info/exclude, which CI does not have.
pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: pnpm biome check --staged --no-errors-on-unmatched
    - name: typecheck
      run: pnpm typecheck
    - name: testes
      run: pnpm test
    - name: nomes-locais
      run: node scripts/nomes-locais.mjs
